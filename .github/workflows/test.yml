name: Lint and test addon
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
      - name: Lint Lua
        run: luacheck WaylaidLedger tests
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check WaylaidLedger tests
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/run.py
      - run: python tests/scan_performance.py --verify
      - run: python tests/scan_performance.py --scenario auctionator --verify
      - run: python tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: WaylaidLedger-install
          path: dist/WaylaidLedger-*.zip
          if-no-files-found: error
