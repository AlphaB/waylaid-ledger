name: Test addon
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_catalog.py
      - run: python tools/build_writs.py
      - run: git diff --exit-code -- WaylaidLedger/Data.lua WaylaidLedger/WritData.lua
      - run: python tests/run.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: WaylaidLedger-install
          path: dist/WaylaidLedger-*.zip
          if-no-files-found: error
